<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <title>KY TERWLOU</title>
    <meta name="description" content="Lire, apprendre et répéter les khassaïdes de Serigne Touba">
    <meta name="theme-color" content="#0E5A43">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="KY TERWLOU">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #F5F8F5;
            --card: #fff;
            --ink: #17231E;
            --mut: #5E6F67;
            --g: #0E5A43;
            --g2: #E1EFE8;
            --gold: #B8892B;
            --line: #D5E0DA;
            --bad: #B3261E
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F1A16;
                --card: #17261F;
                --ink: #E8F0EB;
                --mut: #9DB0A6;
                --g: #4DBB92;
                --g2: #1F3A2F;
                --gold: #E0B04F;
                --line: #2B4137;
                --bad: #F2877F
            }
        }

        :root[data-theme="dark"] {
            --bg: #0F1A16;
            --card: #17261F;
            --ink: #E8F0EB;
            --mut: #9DB0A6;
            --g: #4DBB92;
            --g2: #1F3A2F;
            --gold: #E0B04F;
            --line: #2B4137;
            --bad: #F2877F
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit
        }

        html {
            font-size: var(--fs, 100%)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 1rem/1.5 "Source Sans 3", system-ui, sans-serif;
            overflow-x: hidden
        }

        img,
        video,
        iframe,
        audio {
            max-width: 100%
        }

        h1,
        h2,
        h3 {
            font-family: Amiri, Georgia, serif;
            margin: 0 0 .5rem;
            line-height: 1.2
        }

        h1 {
            font-size: 2rem
        }

        h2 {
            font-size: 1.5rem
        }

        h3 {
            font-size: 1.2rem
        }

        header {
            background: var(--g);
            color: #fff;
            padding: 0 1rem;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .6rem;
            position: sticky;
            top: 0;
            z-index: 4
        }

        header .row {
            flex-wrap: nowrap;
            min-width: 0
        }

        header b {
            white-space: nowrap
        }

        header b {
            font: 700 1.6rem Amiri, serif;
            letter-spacing: .04em
        }

        header button {
            background: transparent;
            color: #fff;
            border: 1px solid #ffffff80
        }

        .logo {
            height: 52px;
            width: auto;
            border-radius: 6px;
            object-fit: contain;
            flex: none
        }

        .big {
            height: 150px !important
        }

        .ph {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--gold);
            color: var(--gold);
            font-size: .7rem;
            background: transparent
        }

        nav {
            display: flex;
            gap: .2rem;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            padding: 0 .5rem
        }

        nav button {
            display: flex;
            align-items: center;
            gap: .5rem;
            background: none;
            border: 0;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            color: var(--mut);
            padding: .8rem .9rem;
            font-weight: 600;
            white-space: nowrap
        }

        nav button.on {
            color: var(--g);
            border-color: var(--gold)
        }

        nav .sh {
            display: none
        }

        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 1.2rem 1.5rem 9rem
        }

        @media(min-width:1000px) {
            nav {
                position: fixed;
                top: 68px;
                left: 0;
                bottom: 0;
                width: 230px;
                flex-direction: column;
                gap: .3rem;
                border-right: 1px solid var(--line);
                border-bottom: 0;
                padding: 1rem .6rem;
                overflow-y: auto
            }

            nav button {
                border-bottom: 0;
                border-left: 4px solid transparent;
                border-radius: 8px;
                font-size: 1.05rem;
                text-align: left;
                width: 100%
            }

            nav button.on {
                background: var(--g2);
                border-left-color: var(--gold)
            }

            main {
                margin-left: 230px;
                max-width: none;
                padding: 1.5rem 2.5rem 6rem
            }

            #fm,
            #main {
                max-width: 920px
            }

            #panel {
                left: 230px
            }
        }

        @media(max-width:699px) {
            nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 6;
                border-top: 2px solid var(--gold);
                border-bottom: 0;
                padding: 0 0 env(safe-area-inset-bottom, 0px);
                gap: 0;
                justify-content: space-between
            }

            nav button {
                flex: 1;
                min-width: 0;
                flex-direction: column;
                gap: 0;
                padding: .45rem .1rem;
                border-bottom: 0;
                border-top: 3px solid transparent;
                font-size: .68rem;
                line-height: 1.2;
                justify-content: center;
                min-height: 58px
            }

            nav button.on {
                border-top-color: var(--gold);
                background: var(--g2)
            }

            nav .lg {
                display: none
            }

            nav .sh {
                display: inline
            }

            nav .ic {
                font-size: 1.25rem
            }

            main {
                padding: 1rem 1rem 8rem
            }

            #panel {
                bottom: calc(58px + env(safe-area-inset-bottom, 0px));
                padding-bottom: .8rem
            }

            header b {
                font-size: 1.25rem
            }

            .logo {
                height: 46px;
                width: auto
            }

            h1 {
                font-size: 1.6rem
            }

            .card {
                padding: .85rem
            }

            .row>button:not(.sm),
            .row>a.btn:not(.sm) {
                flex: 1 1 auto;
                justify-content: center
            }

            input[type=date] {
                width: 100% !important
            }
        }

        @media(min-width:700px) and (max-width:999px) {
            main {
                padding: 1.2rem 1.5rem 8rem
            }

            nav button {
                padding: .9rem 1rem
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: .8rem
        }

        .row {
            display: flex;
            gap: .6rem;
            flex-wrap: wrap;
            align-items: center
        }

        .sp {
            justify-content: space-between
        }

        .grow {
            flex: 1;
            min-width: 150px
        }

        button,
        a.btn {
            font: inherit;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid var(--g);
            background: var(--g);
            color: #fff;
            padding: .55rem 1rem;
            min-height: 44px;
            text-decoration: none;
            display: inline-flex;
            align-items: center
        }

        button.sec,
        a.btn.sec {
            background: transparent;
            color: var(--g)
        }

        button.bad {
            background: transparent;
            color: var(--bad);
            border-color: var(--bad)
        }

        button.sm,
        a.btn.sm {
            min-height: 36px;
            padding: .3rem .7rem;
            font-size: .92rem
        }

        :is(button, input, select, textarea, a):focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        input,
        select,
        textarea {
            font: inherit;
            width: 100%;
            padding: .55rem .7rem;
            min-height: 44px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--ink)
        }

        label {
            display: block;
            font-weight: 600;
            margin: .6rem 0 .2rem
        }

        label.ck {
            display: flex;
            gap: .5rem;
            align-items: center;
            font-weight: 400;
            margin: .2rem 0
        }

        label.ck input {
            width: auto;
            min-height: 0
        }

        .badge {
            display: inline-block;
            padding: .1rem .6rem;
            border-radius: 99px;
            background: var(--g2);
            color: var(--g);
            font-size: .85rem;
            font-weight: 600
        }

        .badge.w {
            background: #F6E8C4;
            color: #6B4E0E
        }

        .mut {
            color: var(--mut)
        }

        .empty {
            text-align: center;
            color: var(--mut);
            padding: 1.5rem;
            border: 2px dashed var(--line);
            border-radius: 10px;
            margin-bottom: .8rem
        }

        .bar {
            height: 8px;
            background: var(--g2);
            border-radius: 9px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--g)
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: .8rem
        }

        .num {
            font: 700 1.6rem Amiri, serif;
            color: var(--gold);
            min-width: 2rem
        }

        .done {
            opacity: .65
        }

        .done .t {
            text-decoration: line-through
        }

        #panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--card);
            border-top: 3px solid var(--gold);
            padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom, 0px));
            z-index: 5;
            max-height: 80vh;
            overflow: auto
        }

        #panel iframe.yt {
            width: 100%;
            aspect-ratio: 16/9;
            border: 0;
            border-radius: 8px
        }

        #panel video {
            width: 100%;
            max-height: 50vh
        }

        #panel audio {
            width: 100%
        }

        .note {
            background: #F6E8C4;
            color: #4B3608;
            border-radius: 8px;
            padding: .6rem .9rem;
            margin-bottom: 1rem;
            font-size: .92rem
        }

        .err {
            background: #FBE3E0;
            color: #7A1710
        }

        #pdfp {
            position: fixed;
            top: calc(68px + env(safe-area-inset-top, 0px));
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 4;
            padding: .6rem 1rem;
            display: flex;
            flex-direction: column;
            gap: .5rem;
            overflow: hidden
        }

        #pdfp[hidden] {
            display: none
        }

        #pdfp iframe {
            flex: 1;
            min-height: 0;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff
        }

        @media(min-width:1000px) {
            #pdfp {
                left: 230px
            }
        }

        textarea.code {
            font-family: ui-monospace, monospace;
            font-size: .82rem;
            min-height: 120px
        }

        .pr {
            display: none
        }

        @media print {

            header,
            nav,
            #panel,
            button,
            .noprint,
            a.btn,
            input,
            select {
                display: none !important
            }

            .pr {
                display: flex;
                gap: 1rem;
                align-items: center;
                border-bottom: 3px solid #B8892B;
                margin-bottom: 1rem
            }

            body {
                background: #fff;
                color: #000
            }

            .card {
                break-inside: avoid
            }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: .7rem;
            margin-bottom: 1rem
        }

        .stat {
            background: var(--card);
            border: 1px solid var(--line);
            border-left: 4px solid var(--gold);
            border-radius: 6px;
            padding: .7rem 1rem
        }

        .stat b {
            font: 700 1.9rem Amiri, serif;
            color: var(--g);
            display: block
        }

        .stat span {
            color: var(--mut);
            font-size: .9rem
        }

        nav:empty {
            display: none
        }

        @media(min-width:1000px) {
            nav:empty+main {
                margin-left: 0
            }

            nav:empty+main #fm,
            nav:empty+main #main {
                margin: 0 auto
            }
        }
    </style>
</head>

    <header>
        <div class="row" id="hd"></div>
        <div class="row" style="flex:none"><button class="sm" onclick="tsize()"
                aria-label="Agrandir le texte">A+</button><button class="sm" id="lo" onclick="signOut()"

    <div id="panel" hidden></div>

                body = `<h2>${ATAB == 'admin' ? 'Espace administrateur' : up ? 'Créer un compte' : 'Connexion'}</h2><div style="text-align:left"><label for="ae">Adresse e-mail</label><input id="ae" type="email" autocomplete="email" inputmode="email"><label for="ap">Mot de passe</label><input id="ap" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" onkeydown="if(event.key=='Enter')doAuth()"></div><br>
  <button id="ab" style="width:100%;justify-content:center" onclick="doAuth()">${ATAB == 'admin' ? 'Continuer' : up ? 'Créer mon compte' : 'Se connecter'}</button>
  <p>${ATAB == 'user' ? `<button class="sm sec" onclick="AMODE='${up ? 'in' : 'up'}';renderAuth()">${up ? 'Déjà un compte ?' : 'Créer un compte'}</button> ` : ''}<button class="sm sec" onclick="resetPw()">Mot de passe oublié</button></p>${ATAB == 'user' ? `<hr style="border:0;border-top:1px solid var(--line);margin:1rem 0"><button class="sec" style="width:100%;justify-content:center" onclick="localMode()">Utiliser sans compte</button><p class="mut" style="font-size:.9rem">Vos données restent sur cet appareil.</p>` : ''}`
            }
            $('#main').innerHTML = `<div class="card" style="max-width:440px;margin:1rem auto;text-align:center">${logoImg('logo big')}<h1 style="margin-top:.5rem">KY TERWLOU</h1><div id="am" class="note err" role="alert" hidden></div>${body}</div>`;
            if (AMODE == 'mfa' && MF && MF.qr) { const q = $('#qr'); if (q) q.src = MF.qr }
        }
        async function syncStats() {
            if (!SB || !AUTHED || IS_ADM || UID == 'local') return;
            try { await SB.from('stats').update({ n_k: S.k.length, n_a: S.a.length, n_p: S.p.length, n_d: S.d.length, n_s: S.s.filter(x => x.st == 'done').length, last_seen: new Date().toISOString() }).eq('user_id', UID) } catch (e) { }
        }
        // ---------- TABLEAU DE BORD ADMIN
        async function loadAdm() {
            ADM.loaded = true;
            try {
                const [p, s] = await Promise.all([SB.from('profiles').select('id,email,role,suspended,created_at').limit(5000), SB.from('stats').select('*').limit(5000)]);
                if (p.error) throw p.error; if (s.error) throw s.error; ADM.p = p.data; ADM.s = s.data; ADM.err = ''
            }
            catch (e) { ADM.err = e.message || 'Erreur de chargement' }
            if (IS_ADM && (V == 'adm' || V == 'usr')) $('#main').innerHTML = (V == 'adm' ? vAdm : vUsr)()
        }
        function setPer(v) { APER = v; render() }
        function vAdm() {
            if (!ADM.loaded || (!ADM.p && !ADM.err)) return `<h1>Tableau de bord</h1><p class="mut">Chargement…</p>`;
            if (ADM.err) return `<h1>Tableau de bord</h1><div class="note err">${esc(ADM.err)}</div><button onclick="ADM={loaded:false};render()">Réessayer</button>`;
            const us = ADM.p.filter(x => x.role != 'admin'), st = Object.fromEntries(ADM.s.map(x => [x.user_id, x])), now = Date.now(), d30 = now - 30 * 864e5, d7 = now - 7 * 864e5;
            const act = us.filter(u => st[u.id] && st[u.id].last_seen && new Date(st[u.id].last_seen) > d30).length, n7 = us.filter(u => new Date(u.created_at) > d7).length, sus = us.filter(u => u.suspended).length;
            const sum = k => us.reduce((a, u) => a + ((st[u.id] || {})[k] || 0), 0);
            const nb = APER == 'jour' ? 30 : APER == 'mois' ? 12 : 5, ser = [];
            for (let i = nb - 1; i >= 0; i--) {
                const d = new Date(); let key, lab;
                if (APER == 'jour') { d.setDate(d.getDate() - i); key = d.toISOString().slice(0, 10); lab = key.slice(5) }
                else if (APER == 'mois') { d.setDate(1); d.setMonth(d.getMonth() - i); key = d.toISOString().slice(0, 7); lab = key }
                else { key = String(d.getFullYear() - i); lab = key }
                ser.push({ lab, n: us.filter(u => String(u.created_at).startsWith(key)).length })
            }
            const mx = Math.max(1, ...ser.map(x => x.n)), c = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
            return `<div class="row sp"><h1>Tableau de bord</h1><button class="sm sec" onclick="ADM={loaded:false};render()">Actualiser</button></div>
 <h3>Utilisateurs</h3><div class="stats">${c(us.length, 'utilisateurs inscrits')}${c(act, 'actifs (30 jours)')}${c(n7, 'nouveaux (7 jours)')}${c(sus, 'comptes suspendus')}</div>
 <div class="card"><div class="row sp"><h3 style="margin:0">Nouvelles inscriptions</h3><select style="width:auto" aria-label="Période" onchange="setPer(this.value)"><option value="jour" ${APER == 'jour' ? 'selected' : ''}>30 derniers jours</option><option value="mois" ${APER == 'mois' ? 'selected' : ''}>12 derniers mois</option><option value="an" ${APER == 'an' ? 'selected' : ''}>5 dernières années</option></select></div>
 ${us.length ? `<div role="img" aria-label="Graphique des nouvelles inscriptions" style="display:flex;align-items:flex-end;gap:2px;height:140px;margin-top:1rem">${ser.map(x => `<div title="${x.lab} : ${x.n}" style="flex:1;background:var(--g);height:${x.n / mx * 100}%;min-height:${x.n ? 4 : 1}px;border-radius:3px 3px 0 0"></div>`).join('')}</div><div class="row sp mut" style="font-size:.8rem"><span>${ser[0].lab}</span><span>${ser[ser.length - 1].lab}</span></div>` : '<p class="mut">Aucune inscription pour le moment.</p>'}</div>
 <h3>Activité déclarée par les utilisateurs</h3><div class="stats">${c(sum('n_d'), 'dahiras')}${c(sum('n_p'), 'programmes')}${c(sum('n_k'), 'khassaïdes ajoutés')}${c(sum('n_a'), 'airs ajoutés')}${c(sum('n_s'), 'récitations effectuées')}</div>
 <p class="mut">Ces totaux additionnent les données que chaque application envoie à son ouverture et après chaque modification. Ils ne comptent pas les personnes qui n'ont pas encore ouvert l'application depuis la connexion des comptes.</p>
 <h3>Finances</h3>${empty('Aucun module financier activé : revenus 0, dépenses 0.')}`
        }
        function ulist() {
            const q = UQ.toLowerCase(), st = Object.fromEntries(ADM.s.map(x => [x.user_id, x])), l = ADM.p.filter(x => x.role != 'admin' && (!q || (x.email || '').toLowerCase().includes(q)));
            return l.length ? l.map(u => `<div class="card row sp"><div class="grow"><b>${esc(u.email)}</b><br><span class="mut">Inscrit le ${fmt(String(u.created_at).slice(0, 10))} · dernière activité : ${st[u.id] && st[u.id].last_seen ? fmt(String(st[u.id].last_seen).slice(0, 10)) : '—'}</span></div><span class="badge ${u.suspended ? 'w' : ''}">${u.suspended ? 'Suspendu' : 'Actif'}</span><button class="sm ${u.suspended ? '' : 'bad'}" onclick="toggleSusp('${u.id}')">${u.suspended ? 'Réactiver' : 'Suspendre'}</button></div>`).join('') : empty('Aucun utilisateur.')
        }
        function vUsr() {
            if (!ADM.loaded || (!ADM.p && !ADM.err)) return `<h1>Utilisateurs</h1><p class="mut">Chargement…</p>`;
            if (ADM.err) return `<h1>Utilisateurs</h1><div class="note err">${esc(ADM.err)}</div>`;
            return `<h1>Utilisateurs</h1><label for="uq">Rechercher par e-mail</label><input id="uq" value="${esc(UQ)}" oninput="UQ=this.value;$('#ul').innerHTML=ulist()"><div id="ul" style="margin-top:.8rem">${ulist()}</div>`
        }
        async function toggleSusp(id) {
            const u = ADM.p.find(x => x.id == id); if (!u) return;
            if (!confirm((u.suspended ? 'Réactiver' : 'Suspendre') + ' le compte ' + u.email + ' ?')) return;
            const { error } = await SB.from('profiles').update({ suspended: !u.suspended }).eq('id', id);
            if (error) return flash(error.message); u.suspended = !u.suspended; render()
        }
        boot();
        if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => { }));
    </script>
</body>

</html>
